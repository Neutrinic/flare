# Documentation site, built by .github/workflows/docs.yml and published to GitHub Pages (#129).
[project]
site_name = "Flare"
site_description = "OpenTelemetry tracing, metrics and logs for Apache Spark, across driver and executors"
# Versioned by mike (#161): pages live under 1.3/, 1.4/ and so on, and latest/ is the newest
# release. This is the unversioned root: a versioned build appends the version to it, or
# mike's canonical_version below.
site_url = "https://neutrinic.github.io/flare/"
repo_url = "https://github.com/Neutrinic/flare"
repo_name = "Neutrinic/flare"
edit_uri = "edit/main/docs/"
copyright = "Apache License 2.0"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/quick-start.md",
    "getting-started/download.md",
    "getting-started/choosing-a-jar.md",
    "getting-started/python.md",
    "getting-started/local-stack.md",
  ] },
  { "Deploying" = [
    "deploying/index.md",
    "deploying/standalone.md",
    "deploying/yarn.md",
    "deploying/kubernetes.md",
    "deploying/emr.md",
    "deploying/emr-serverless.md",
    "deploying/dataproc.md",
    "deploying/dataproc-serverless.md",
    "deploying/databricks.md",
    "deploying/hdinsight.md",
    "deploying/unsupported.md",
  ] },
  { "Configuration" = [
    "configuration/index.md",
    "configuration/exporting.md",
    "configuration/noise.md",
    "configuration/volume.md",
    "configuration/alerting.md",
  ] },
  { "Reference" = [
    "reference/spans.md",
    "reference/metrics.md",
    "reference/compatibility.md",
    "reference/overhead.md",
  ] },
  { "Upgrading" = "upgrading.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Privacy" = "privacy.md" },
  { "Building Flare" = "building.md" },
]

[project.theme]
language = "en"
# The Scarf page-view notice and pixel live in overrides/partials/copyright.html (#160).
custom_dir = "overrides"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# One site per minor release, deployed by mike to the gh-pages branch, with a version selector.
[project.extra.version]
provider = "mike"
default = "latest"

# `latest` is a full copy rather than a symlink, so it does not depend on how the Pages artifact
# treats links.
[project.plugins.mike]
alias_type = "copy"
# Canonical links of every version point at latest/, so search engines index the current docs.
canonical_version = "latest"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets = { base_path = ["docs/snippets"], check_paths = true }
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
