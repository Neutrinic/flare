# Mimir single-binary mode — OTLP metrics ingest for dev stack

target: all

multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095

distributor:
  ring:
    kvstore:
      store: inmemory
    instance_addr: 127.0.0.1

ingester:
  ring:
    kvstore:
      store: inmemory
    instance_addr: 127.0.0.1
    replication_factor: 1

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/blocks
  tsdb:
    dir: /data/mimir/tsdb
  bucket_store:
    sync_dir: /data/mimir/sync

compactor:
  data_dir: /data/mimir/compactor
  sharding_ring:
    kvstore:
      store: inmemory

store_gateway:
  sharding_ring:
    kvstore:
      store: inmemory
    replication_factor: 1

limits:
  native_histograms_ingestion_enabled: true
  # Exemplar storage is OFF by default in Mimir (0 = disabled). Without this, the exemplars the
  # OTEL SDK attaches to flare.task.duration are accepted at ingest and silently discarded, so
  # the dashboard's "exemplar": true and the Mimir datasource's exemplarTraceIdDestinations
  # have nothing to render and the trace/metric correlation looks broken end to end.
  max_global_exemplars_per_user: 100000
