apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo:3200
    isDefault: true
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: '-30m'
        spanEndTimeShift: '30m'
        queries:
          - name: Task Duration p95 (ms)
            query: 'histogram_quantile(0.95, sum(spark_task_duration_bucket) by (le))'
          - name: Avg Task Duration (ms)
            query: 'sum(spark_task_duration_sum) / sum(spark_task_duration_count)'
          - name: Total Tasks
            query: 'sum(spark_task_duration_count)'
          - name: Shuffle Read (bytes)
            query: 'sum(spark_task_shuffle_read_bytes)'
          - name: Shuffle Write (bytes)
            query: 'sum(spark_task_shuffle_write_bytes)'
          - name: Stage Executor Run Time p95 (ms)
            query: 'histogram_quantile(0.95, sum(spark_stage_executor_run_time_bucket) by (le))'
          - name: Stage Input (bytes)
            query: 'sum(spark_stage_input_bytes)'
          - name: Stage Shuffle Read (bytes)
            query: 'sum(spark_stage_shuffle_read_bytes)'
          - name: Stage Shuffle Write (bytes)
            query: 'sum(spark_stage_shuffle_write_bytes)'
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: mimir

  - name: Mimir
    type: prometheus
    access: proxy
    uid: mimir
    url: http://mimir:9009/prometheus
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    editable: false
    jsonData:
      # Derived field creates clickable Tempo links in log lines that contain
      # "trace_id=<hex>" in the body text. Most Spark logs won't match — the
      # trace_id arrives as OTLP structured metadata instead. This fires only
      # for user app code that explicitly logs the trace ID as a key=value pair.
      # The primary logs→traces path is Grafana's built-in structured metadata
      # detection; the primary traces→logs path is tracesToLogsV2 above.
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: 'trace_id=(\w+)'
          name: TraceID
          url: '${__value.raw}'
