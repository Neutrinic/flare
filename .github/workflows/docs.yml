name: Documentation

# Publishes docs/ to GitHub Pages (#129).
#
# The site describes the released JAR, so it deploys on release tags, not on every push to main:
# docs for an unreleased install would be wrong for everyone using the version on Maven Central.
# A manual run republishes a given release tag, for example after a failed deploy, or publishes
# main when only documentation has changed since the latest release (#155): nothing under src/,
# build.sbt or project/, so the docs still describe exactly the released JAR. It refuses main as
# soon as main carries unreleased code.
#
# Pull requests that touch the docs only build them, in strict mode, so a broken link or page fails
# the PR instead of the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "A release tag, e.g. v1.3.0, or main for documentation changed since the latest release"
        required: true
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
      - ".github/scripts/stamp_docs_version.py"

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'workflow_dispatch' && !startsWith(inputs.ref, 'v') && inputs.ref != 'main'
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "::error::'$REF' is neither a release tag nor main"
          exit 1

      - uses: actions/checkout@v7
        with:
          # A manual run builds what it was asked for, not the branch it was started from.
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' && (inputs.ref == 'main' && 'refs/heads/main'
            || format('refs/tags/{0}', inputs.ref)) || '' }}
          # main is checked against the latest release, which needs the tags and history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.ref == 'main' && '0' || '1' }}
          persist-credentials: false

      # Which release these docs describe: the tag itself, or for main the latest release, and then
      # only if nothing that ships in the JAR has changed since it.
      - if: github.event_name != 'pull_request'
        env:
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          if [ "$REF" != main ]; then
            echo "PUBLISH_TAG=$REF" >> "$GITHUB_ENV"
            exit 0
          fi
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          shipped=$(git diff --name-only "$latest" HEAD -- src build.sbt project)
          if [ -n "$shipped" ]; then
            echo "::error::main has changes that ship in the JAR since $latest, so its docs would describe an unreleased version:"
            echo "$shipped"
            exit 1
          fi
          echo "main has only documentation changes since $latest; publishing them as $latest"
          echo "PUBLISH_TAG=$latest" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Pinned: Zensical is pre-1.0 and its output may change between releases.
      - run: pip install zensical==0.0.65

      # The docs name the Flare version in one place, docs/snippets/. Set it from the tag being
      # published, so a release can never deploy docs that name the previous version (#133).
      - if: github.event_name != 'pull_request'
        run: python .github/scripts/stamp_docs_version.py "$PUBLISH_TAG"

      # On a pull request, prove the stamping still works on the snippets as they are, then put
      # them back, so the build below checks the committed docs.
      - if: github.event_name == 'pull_request'
        run: |
          python .github/scripts/stamp_docs_version.py v9.9.9
          git diff --stat -- docs/snippets
          git checkout -- docs/snippets

      - run: zensical build --strict --clean

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
