name: Documentation

# Publishes docs/ to GitHub Pages (#129).
#
# The site describes the released JAR, so it deploys on release tags, not on every push to main:
# docs for an unreleased install would be wrong for everyone using the version on Maven Central.
# A manual run republishes a given release tag, for example after a failed deploy. It never builds
# a branch, which would publish docs for changes not in any released JAR.
#
# Pull requests that touch the docs only build them, in strict mode, so a broken link or page fails
# the PR instead of the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.3.0"
        required: true
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
      - ".github/scripts/stamp_docs_version.py"

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'workflow_dispatch' && !startsWith(inputs.tag, 'v')
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "::error::'$TAG' is not a release tag; manual runs publish a v* tag only"
          exit 1

      - uses: actions/checkout@v7
        with:
          # A manual run builds the requested release tag, not the branch it was started from.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Pinned: Zensical is pre-1.0 and its output may change between releases.
      - run: pip install zensical==0.0.65

      # The docs name the Flare version in one place, docs/snippets/. Set it from the tag being
      # published, so a release can never deploy docs that name the previous version (#133).
      - if: github.event_name != 'pull_request'
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python .github/scripts/stamp_docs_version.py "$TAG"

      - run: zensical build --strict --clean

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
