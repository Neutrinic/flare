name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "3.3.4"
            scala: "2.12.18"
          - spark: "3.3.4"
            scala: "2.13.16"
          - spark: "3.4.3"
            scala: "2.12.18"
          - spark: "3.4.3"
            scala: "2.13.16"
          - spark: "3.5.1"
            scala: "2.12.18"
          - spark: "3.5.1"
            scala: "2.13.16"
          - spark: "4.0.0"
            scala: "2.13.16"

    name: Spark ${{ matrix.spark }} / Scala ${{ matrix.scala }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      - name: Compile
        run: sbt -DsparkVersion=${{ matrix.spark }} ++${{ matrix.scala }} compile

      - name: Test
        run: sbt -DsparkVersion=${{ matrix.spark }} ++${{ matrix.scala }} test

      - name: Assembly
        run: sbt -DsparkVersion=${{ matrix.spark }} ++${{ matrix.scala }} assembly
