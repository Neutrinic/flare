name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the run it replaces (#194). Runs on main are never cancelled:
# every commit there is tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "3.3.4"
            scala: "2.12.18"
          - spark: "3.3.4"
            scala: "2.13.16"
          - spark: "3.4.3"
            scala: "2.12.18"
          - spark: "3.4.3"
            scala: "2.13.16"
          - spark: "3.5.1"
            scala: "2.12.18"
          - spark: "3.5.1"
            scala: "2.13.16"
          - spark: "4.0.0"
            scala: "2.13.16"

    name: Spark ${{ matrix.spark }} / Scala ${{ matrix.scala }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      - name: Compile
        run: sbt -DsparkVersion=${{ matrix.spark }} ++${{ matrix.scala }} compile

      - name: Test
        run: sbt -DsparkVersion=${{ matrix.spark }} ++${{ matrix.scala }} test

      - name: Assembly
        run: sbt -DsparkVersion=${{ matrix.spark }} ++${{ matrix.scala }} assembly

  agent-test:
    name: Real agent extension smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      - name: Test assembled OpenTelemetry extension
        run: sbt -DsparkVersion=3.5.1 ++2.13.16 "AgentTest / test"

  # Changelog fragments (#194) parse, so a malformed one fails here rather than at release.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check changelog fragments
        run: python .github/scripts/release_changelog.py --check
