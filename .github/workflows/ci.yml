name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "3.3.4"
            scala: "2.12.18"
          - spark: "3.3.4"
            scala: "2.13.16"
          - spark: "3.4.3"
            scala: "2.12.18"
          - spark: "3.4.3"
            scala: "2.13.16"
          - spark: "3.5.1"
            scala: "2.12.18"
          - spark: "3.5.1"
            scala: "2.13.16"
          - spark: "4.0.0"
            scala: "2.13.16"

    name: Spark ${{ matrix.spark }} / Scala ${{ matrix.scala }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      - name: Compile
        run: sbt -DsparkVersion=${{ matrix.spark }} ++${{ matrix.scala }} compile

      - name: Test
        run: sbt -DsparkVersion=${{ matrix.spark }} ++${{ matrix.scala }} test

      - name: Assembly
        run: sbt -DsparkVersion=${{ matrix.spark }} ++${{ matrix.scala }} assembly

  agent-test:
    name: Real agent extension smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      - name: Test assembled OpenTelemetry extension
        run: sbt -DsparkVersion=3.5.1 ++2.13.16 "AgentTest / test"

  # The example alert rules (#92): valid, and the promtool unit tests pass. Pinned to the
  # Prometheus release they were written against.
  alert-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Check and test the example alert rules
        run: |
          docker run --rm -v "$PWD/alerting:/r" -w /r --entrypoint promtool prom/prometheus:v3.15.0 check rules flare-rules.yml
          docker run --rm -v "$PWD/alerting:/r" -w /r --entrypoint promtool prom/prometheus:v3.15.0 test rules flare-rules.test.yml
