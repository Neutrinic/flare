name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    # Needed to create the Release object and upload assets to it.
    permissions:
      contents: write

    strategy:
      # Coordinates are disjoint across jobs (see below), so a failure in one says
      # nothing about the others. Cancelling a sibling mid-upload would leave a
      # partial deployment on the Central Portal, which cannot be re-cut.
      fail-fast: false
      matrix:
        # Spark axis ONLY. `ci-release` runs `+publishSigned`, and the `+` cross-builds
        # every entry in `crossScalaVersions` regardless of any preceding `++`. Adding a
        # Scala axis therefore does not split the work — it makes each job publish the
        # SAME coordinates, and concurrent jobs collide on the Central Portal with
        # "currently being published in another deployment". Scala comes from
        # `crossScalaVersions` in build.sbt, which already scopes Spark 4.0 to 2.13.
        spark: ["3.3.4", "3.4.3", "3.5.1", "4.0.0"]

    name: Publish Spark ${{ matrix.spark }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      - name: Publish to Maven Central
        run: sbt -DsparkVersion=${{ matrix.spark }} ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      # ── GitHub Release assets ───────────────────────────────────────────────
      #
      # The same assembly JAR that ci-release publishes to Maven Central (#107): it bundles the
      # OpenTelemetry API, so each is a single placeable file with no separate OTEL JARs (#103).
      # Attached here so it can be downloaded without a Maven resolver (#109).

      - name: Build assembly JARs
        # Shared with dev.yml, which runs it on every push to main — so this path is exercised
        # continuously rather than only when a version tag is pushed (#114).
        run: bash .github/scripts/build-assemblies.sh "${{ matrix.spark }}" "${GITHUB_REF_NAME#v}" release-assets

      - name: Attach JARs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Releases have been created by hand after the tag push, so the object may not exist
          # when this runs. Matrix jobs can also race to create it, hence tolerating failure
          # and then asserting it exists. --clobber keeps re-runs idempotent.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes \
            || true
          gh release view "$TAG" >/dev/null

          gh release upload "$TAG" release-assets/*.jar --clobber

  # A failed sibling leaves the Release with fewer than seven assets, and nothing cleans up
  # after it. Rather than gate every asset behind every job, this reports the shortfall.
  #
  # Gating would be worse here. Assets deliberately mirror what actually reached Central: a
  # coordinate whose publish failed should NOT be advertised on the Release. Holding all seven
  # back because one failed would also withhold six working ones, and per-job upload means
  # re-running just the failed matrix entry repairs the Release — which is how a partial
  # deployment has always been fixed (see #65).
  verify-assets:
    runs-on: ubuntu-latest
    needs: publish
    # Runs even when a matrix entry failed; reporting the shortfall is the whole point.
    if: always()

    permissions:
      contents: read

    steps:
      - name: Check the Release carries all seven coordinates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          EXPECTED="flare-spark-3-3_2.12 flare-spark-3-3_2.13 \
                    flare-spark-3-4_2.12 flare-spark-3-4_2.13 \
                    flare-spark-3-5_2.12 flare-spark-3-5_2.13 \
                    flare-spark-4-0_2.13"

          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name' > actual.txt || : > actual.txt

          MISSING=""
          for COORD in $EXPECTED; do
            grep -qx "${COORD}-${VERSION}.jar" actual.txt || MISSING="$MISSING ${COORD}"
          done

          if [ -n "$MISSING" ]; then
            echo "Release $TAG is missing assets for:$MISSING" >&2
            echo "Re-run the failed matrix job to repair it." >&2
            echo "Present:" >&2
            cat actual.txt >&2
            exit 1
          fi

          echo "All seven coordinates present on $TAG."

